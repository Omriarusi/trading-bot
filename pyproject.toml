[project]
name = "trading-bot"
version = "1.0.0"
description = "Automated swing-trading bot for Interactive Brokers"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are handled by the formatter, not enforced here
    "B008",    # dataclass field defaults are idiomatic in this codebase
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on magic numbers by design, and shadow fixtures by name.
"tests/*" = ["B011", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
