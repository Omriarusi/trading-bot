name: Refresh S&P 500

# Regenerates bot/sp500.py from the live constituent list and commits it.
#
# Index membership changes several times a year. Left alone, the bot would
# slowly drift into trading names that have left the index and ignoring ones
# that joined. Monthly is frequent enough to track that without churning the
# repository.

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the first of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-universe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt lxml

      - name: Refresh the constituent list
        run: python scripts/refresh_sp500.py

      - name: Verify the bot still starts with the new universe
        # A malformed universe must be caught here, not by a scheduled trading
        # run discovering it minutes before the market opens.
        run: |
          python -m bot.cli validate-config
          python -c "
          from bot.universe_list import get_universe
          names = get_universe('sp500')
          assert len(names) > 400, f'only {len(names)} symbols'
          print(f'{len(names)} symbols available')
          "

      - name: Commit the change
        run: |
          set -euo pipefail
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/sp500.py
          if git diff --staged --quiet; then
            echo "No membership change this month."
            exit 0
          fi
          git commit -m "Refresh S&P 500 constituents ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
