name: Strategy sweep

# Compares the pre-registered strategy variants over identical history.
# Manual only: this is a decision-making tool, not a metric to accumulate.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history"
        required: false
        default: "10"
      equity:
        description: "Starting equity"
        required: false
        default: "1400"
      universe:
        # No default here. workflow_dispatch fills an unset input with its
        # own YAML default before the job ever sees it — a "blended" default
        # here would silently override config.yaml on every manual run with
        # no universe typed in, exactly as it did once. Leaving this blank
        # lets ${{ inputs.universe }} come through empty, so the run step's
        # own fallback (config.yaml's universe) actually takes effect.
        description: "liquid_us_large_cap, high_beta_us, blended, or sp500 (blank = whatever config.yaml trades)"
        required: false
      start:
        description: "Start date (YYYY-MM-DD), to test a specific regime"
        required: false
      end:
        description: "End date (YYYY-MM-DD)"
        required: false
  push:
    paths:
      - "backtest/sweep.py"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sweep
        env:
          IN_YEARS: ${{ inputs.years }}
          IN_EQUITY: ${{ inputs.equity }}
          IN_UNIVERSE: ${{ inputs.universe }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          mkdir -p results

          # Push events receive no workflow_dispatch input defaults.
          IN_YEARS="${IN_YEARS:-10}"
          IN_EQUITY="${IN_EQUITY:-1400}"

          ARGS=(--years "$IN_YEARS" --equity "$IN_EQUITY")
          # No universe default. Left unset, the sweep measures whatever
          # config.yaml trades, which is the thing worth knowing about. Forcing
          # a default here silently benchmarked a universe the bot had already
          # stopped trading.
          if [ -n "$IN_UNIVERSE" ]; then ARGS+=(--universe "$IN_UNIVERSE"); fi
          if [ -n "$IN_START" ]; then ARGS+=(--start "$IN_START"); fi
          if [ -n "$IN_END" ];   then ARGS+=(--end "$IN_END"); fi

          python -m bot.cli sweep "${ARGS[@]}" --json-out results/sweep.json \
            | tee results/sweep.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-results
          path: results/
          retention-days: 30
